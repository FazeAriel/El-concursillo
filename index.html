<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>El Concursillo</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:#fff}
body{min-height:100vh;background:linear-gradient(135deg,#4b176e 0%,#8f52bd 48%,#5b237f 100%);display:block;padding:0;overflow-x:hidden}
.app{width:100%;min-height:100vh;padding:24px 34px 34px;border-radius:0;background:linear-gradient(145deg,#6e35a3cc,#a35cc966 45%,#5c237dcc);box-shadow:none;position:relative}
.app:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 78% 18%,#ffffff18,transparent 26%),radial-gradient(circle at 15% 70%,#ffffff0d,transparent 30%)}
.home{text-align:center;padding:70px 15px}.logo{font-size:46px;font-weight:900;text-shadow:0 5px 15px #0008}.subtitle{margin-top:12px;font-weight:800;letter-spacing:2px}.catGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:min(620px,100%);margin:30px auto 0}.catBtn{min-height:92px;border:2px solid #fff4;border-radius:18px;background:#ffffff12;color:#fff;font-size:26px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 30px #0002}.catBtn span{font-size:17px;letter-spacing:.5px}.catBtn:hover{background:#ffffff20;transform:translateY(-2px)}.catBtn:last-child{grid-column:1 / -1}.play,.again{margin-top:40px;border:0;border-radius:18px;padding:17px 55px;background:#8b5cf6;color:#fff;font-size:23px;font-weight:900;cursor:pointer}
#game{min-height:calc(100vh - 58px);position:relative;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:nowrap;position:relative;z-index:2}.top>div:first-child{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.mini{font-family:cursive;font-size:54px;font-weight:900;font-style:italic;line-height:.9;color:#fff;text-shadow:3px 3px 0 #15001f,-3px -3px 0 #15001f,0 7px 15px #0007;letter-spacing:-2px}.lives{display:flex;gap:12px;align-items:center}.life{width:60px;height:60px;border-radius:50%;border:3px solid #341052;background:#ffffff16;color:#fff;font-size:21px;cursor:pointer;box-shadow:0 4px 12px #2a073c55,inset 0 0 0 2px #ffffff22}.life:hover:not(:disabled){transform:scale(1.05);background:#ffffff25}.life:disabled{opacity:.35}.recover{background:#16a34a;box-shadow:0 0 16px #22c55e88;animation:pulse .9s infinite alternate}.recover[hidden]{display:none}.menuBtn{border:2px solid #fff7;border-radius:12px;padding:8px 11px;background:#ffffff12;color:#fff;font-weight:900;font-size:13px;cursor:pointer}.menuBtn:hover{background:#ffffff22}.volBtn{width:36px;height:32px;border:2px solid #fff7;border-radius:9px;background:#ffffff12;color:#fff;font-weight:900;font-size:15px;cursor:pointer}.volPct{min-width:42px;text-align:center;font-weight:900;font-size:12px}.musicBtn{margin:18px auto 0;border:2px solid #fff7;border-radius:12px;padding:10px 16px;background:#ffffff12;color:#fff;font-weight:900;font-size:14px;cursor:pointer;display:block}.musicBtn.off{opacity:.65}
.question{margin:auto auto 14px;width:min(1080px,96%);min-height:112px;padding:25px 34px;border:2px solid #6b238e;border-radius:2px;background:#a65bc54d;box-shadow:0 2px 0 #ffffff18 inset;text-align:center;font-size:23px;font-weight:900;line-height:1.35;display:flex;align-items:center;justify-content:center;flex-direction:column}.question .small{font-size:13px;margin-bottom:3px;opacity:.72}
.infoBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(620px,70%);margin:0 auto 13px}.infoBtn{border:2px solid #ffffff55;border-radius:12px;padding:8px 12px;background:#ffffff12;color:#fff;font-size:14px;font-weight:900;cursor:pointer}.hintBtn{border-color:#facc1577}.curiosityBtn{border-color:#67e8f977}
.answers{width:min(1080px,96%);margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:16px 92px}.answer{position:relative;min-height:68px;border:2px solid #6b238e;border-radius:2px;background:#9b55b84d;color:#fff;font-size:18px;font-weight:800;cursor:pointer;padding:12px 22px 12px 56px;text-align:left;box-shadow:0 2px 0 #ffffff12 inset}.answer:before{content:attr(data-letter);position:absolute;left:-25px;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid #5b197f;background:#a764c7;color:#12001d;font-size:25px;font-weight:900;box-shadow:0 2px 6px #0004}.answer:hover:not(:disabled){background:#b86bd066}.answer.selected{outline:3px solid #facc15;transform:translateY(-2px);box-shadow:0 0 0 3px #facc1555}.answer.removed{visibility:hidden}
.resolveBtn{display:block;margin:18px auto 0;border:0;border-radius:13px;padding:12px 34px;background:#16a34a;color:#fff;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 8px 24px #0004}.resolveBtn:disabled{opacity:.4;cursor:not-allowed}.nextBtn{display:block;margin:16px auto 0;border:0;border-radius:13px;padding:12px 32px;background:#8b5cf6;color:#fff;font-size:18px;font-weight:900;cursor:pointer}.meta,.status{text-align:center;margin-top:9px;font-size:13px;min-height:18px}.catLabel{text-align:center;margin-top:8px;font-size:14px;opacity:.75;font-weight:800}
.overlay{position:fixed;inset:0;background:#08040ddd;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.modal{position:relative;width:min(430px,100%);background:#25183f;border:2px solid #a78bfa;border-radius:25px;padding:28px;text-align:center;box-shadow:0 20px 70px #000}.close{position:absolute;right:12px;top:10px;width:38px;height:38px;border:0;border-radius:50%;background:#ffffff18;color:#fff;font-size:26px;cursor:pointer}.timer{font-size:72px;font-weight:900;margin:20px 0}.timer.warning{color:#ffd000;animation:pulse .7s infinite alternate}.call{font-size:48px;animation:ring .8s infinite alternate}.wheelbox{width:220px;height:220px;margin:18px auto;position:relative}.wheel{width:220px;height:220px;border-radius:50%;border:8px solid #fff;background:conic-gradient(#8b5cf6 0 25%,#ec4899 25% 50%,#06b6d4 50% 75%,#f59e0b 75% 100%);display:flex;align-items:center;justify-content:center;position:relative;transform:rotate(0deg);transition:transform 1.9s cubic-bezier(.15,.75,.25,1)}.wheelnums{position:absolute;inset:0;display:block;z-index:3;pointer-events:none}.wheelnums span{position:absolute;width:50%;height:50%;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;text-shadow:0 2px 5px #0008}.wheelnums span:nth-child(1){top:12%;left:50%;transform:translateX(-50%)}.wheelnums span:nth-child(2){top:50%;right:12%;transform:translateY(-50%)}.wheelnums span:nth-child(3){bottom:12%;left:50%;transform:translateX(-50%)}.wheelnums span:nth-child(4){top:50%;left:12%;transform:translateY(-50%)}.pointer{position:absolute;z-index:2;top:-13px;left:50%;transform:translateX(-50%);border-left:14px solid transparent;border-right:14px solid transparent;border-top:30px solid #fff}.result{font-size:25px;font-weight:900;margin:18px}.letters{font-size:32px;font-weight:900;letter-spacing:7px}.small{opacity:.78;font-size:14px;line-height:1.5}@keyframes pulse{to{transform:scale(1.06)}}@keyframes ring{to{transform:rotate(12deg) scale(1.08)} }
@media(max-width:700px){body{padding:0}.app{padding:15px 12px 25px}.top{gap:8px}.mini{font-size:36px}.lives{gap:5px}.life{width:46px;height:46px;font-size:17px}.top>div:first-child .menuBtn,.top>div:first-child .volBtn,.top>div:first-child .volPct{display:none}.question{width:100%;min-height:100px;font-size:18px;padding:18px}.answers{width:100%;grid-template-columns:1fr;gap:13px}.answer{min-height:60px}.infoBtns{width:100%}.answer:before{left:-18px;width:42px;height:42px;font-size:20px}}
</style></head><body><div class="app">
<section id="home" class="home"><div class="logo">EL CONCURSILLO</div><div class="subtitle">ELIGE UNA CATEGORÍA</div><button class="musicBtn" id="musicHome">🎵 MÚSICA: ON</button><div class="volumeBox"><button class="volBtn" id="volDownHome">🔉</button><div class="volPct" id="volPctHome">70%</div><button class="volBtn" id="volUpHome">🔊</button></div><div class="catGrid"><button class="catBtn" data-cat="mixed">🌎<span>TODO UN POCO</span></button><button class="catBtn" data-cat="football">⚽<span>FÚTBOL</span></button><button class="catBtn" data-cat="math">➗<span>MATEMÁTICAS</span></button><button class="catBtn" data-cat="history">📜<span>HISTORIA</span></button><button class="catBtn" data-cat="anime">🎌<span>ANIME</span></button></div></section>
<section id="game" hidden><div class="top"><div style="display:flex;align-items:center;gap:10px"><div class="mini">EL CONCURSILLO</div><button class="menuBtn" id="menuBtn">🏠 MENÚ</button><button class="menuBtn" id="musicGame">🎵 ON</button><button class="volBtn" id="volDownGame" title="Bajar volumen">🔉</button><div class="volPct" id="volPctGame">70%</div><button class="volBtn" id="volUpGame" title="Subir volumen">🔊</button></div><div class="lives"><button class="life" id="fifty">50</button><button class="life" id="call">📞</button><button class="life" id="roulette">🎰</button><button class="life" id="wizard">🔒</button><button class="life recover" id="recover" hidden>➕</button></div></div><div class="question" id="question"></div><div class="infoBtns"><button class="infoBtn hintBtn" id="hint">💡 PISTA</button><button class="infoBtn curiosityBtn" id="curiosity">🤓 CURIOSIDAD</button></div><div class="answers" id="answers"></div><button class="resolveBtn" id="resolveBtn" hidden>✅ RESOLVER</button><div class="status" id="status"></div><button class="nextBtn" id="nextBtn" hidden>SIGUIENTE ➜</button><div class="meta" id="meta"></div></section></div>
<script>
const BANK={"easy":[{"id":"E1","level":"Fácil","q":"Capital de Ecuador?","a":["Quito","Guayaquil","Cuenca","Loja"],"c":0,"h":"Piensa en una ciudad de la Sierra ecuatoriana, no en la costa.","f":"Quito es la capital del Ecuador y su centro histórico fue declarado Patrimonio Cultural de la Humanidad por la UNESCO en 1978."},{"id":"E2","level":"Fácil","q":"Días de una semana?","a":["5","6","7","8"],"c":2,"h":"Cuenta desde lunes hasta domingo.","f":"La semana de siete días se usa desde hace miles de años y está relacionada con antiguas tradiciones babilónicas y romanas."},{"id":"E3","level":"Fácil","q":"Planeta rojo?","a":["Venus","Marte","Júpiter","Saturno"],"c":1,"h":"Es el planeta que suele verse de color rojizo.","f":"Marte se ve rojizo por los minerales de hierro oxidados presentes en su superficie."},{"id":"E4","level":"Fácil","q":"5 + 5?","a":["8","9","10","11"],"c":2,"h":"Suma cinco y cinco.","f":"En el sistema decimal, juntar dos grupos de cinco da como resultado diez."},{"id":"E5","level":"Fácil","q":"Animal que dice miau?","a":["Perro","Gato","Caballo","Vaca"],"c":1,"h":"Es uno de los animales domésticos más comunes.","f":"Los gatos pueden pasar buena parte del día durmiendo y tienen un oído muy sensible."},{"id":"E6","level":"Fácil","q":"Meses de un año?","a":["10","11","12","13"],"c":2,"h":"Piensa en cuántas veces se repite el ciclo de enero a diciembre.","f":"Los nombres de los meses que usamos hoy provienen en gran parte del calendario romano."},{"id":"E7","level":"Fácil","q":"Color de mezclar azul y amarillo?","a":["Rojo","Verde","Morado","Naranja"],"c":1,"h":"Es el color que aparece al combinar un color primario frío con uno primario cálido.","f":"Azul y amarillo son colores primarios en el modelo tradicional de pintura; al mezclarlos suele obtenerse verde."},{"id":"E8","level":"Fácil","q":"Patas de una araña?","a":["6","8","10","12"],"c":1,"h":"No son seis ni diez: piensa en el cuerpo de una araña adulta.","f":"Las arañas pertenecen al grupo de los arácnidos, que normalmente tienen ocho patas."},{"id":"E9","level":"Fácil","q":"Satélite natural de la Tierra?","a":["Sol","Luna","Marte","Venus"],"c":1,"h":"Es el objeto brillante que vemos cambiar de fase durante el mes.","f":"La Luna no produce su propia luz visible; refleja la luz del Sol."},{"id":"E10","level":"Fácil","q":"10 × 2?","a":["12","20","22","25"],"c":1,"h":"Duplica el diez.","f":"Multiplicar por dos es sumar la misma cantidad dos veces."},{"id":"E11","level":"Fácil","q":"Instrumento con teclas blancas y negras?","a":["Guitarra","Violín","Piano","Flauta"],"c":2,"h":"Tiene muchas teclas y se toca con ambas manos.","f":"Un piano moderno suele tener 88 teclas y sus cuerdas son golpeadas por pequeños martillos."},{"id":"E12","level":"Fácil","q":"Idioma oficial de Brasil?","a":["Español","Portugués","Inglés","Francés"],"c":1,"h":"No es español, aunque Brasil está rodeado por países hispanohablantes.","f":"Brasil es el país más grande de Sudamérica y su idioma oficial es el portugués."},{"id":"E13","level":"Fácil","q":"Estrella del centro del sistema solar?","a":["Sirius","Luna","Sol","Polaris"],"c":2,"h":"Es la estrella que vemos durante el día y alrededor de la cual gira la Tierra.","f":"El Sol contiene más del 99 % de la masa del sistema solar."},{"id":"E14","level":"Fácil","q":"Horas de un día?","a":["12","18","24","30"],"c":2,"h":"Piensa en dos veces doce.","f":"La división del día en 24 horas se consolidó a partir de antiguas tradiciones astronómicas."},{"id":"E15","level":"Fácil","q":"Continente donde está Ecuador?","a":["Europa","Asia","África","América"],"c":3,"h":"Ecuador está al oeste de África y al sur de Norteamérica.","f":"Ecuador está en Sudamérica y su territorio continental es atravesado por la línea ecuatorial."},{"id":"E16","level":"Fácil","q":"Líquido que necesitamos para hidratarnos?","a":["Aceite","Agua","Vinagre","Gasolina"],"c":1,"h":"Es transparente y no tiene sabor en su estado más puro.","f":"El agua es esencial para casi todos los seres vivos y participa en muchas reacciones del organismo."},{"id":"E17","level":"Fácil","q":"100 ÷ 10?","a":["5","10","20","25"],"c":1,"h":"Divide 100 en diez grupos iguales.","f":"Dividir entre diez en el sistema decimal equivale a mover la coma una posición hacia la izquierda."},{"id":"E18","level":"Fácil","q":"Rey de la selva?","a":["Tigre","León","Elefante","Lobo"],"c":1,"h":"Es un gran felino con melena en los machos.","f":"Aunque se le llama “rey de la selva”, el león vive principalmente en sabanas y praderas, no en selvas densas."},{"id":"E19","level":"Fácil","q":"Primer mes del año?","a":["Enero","Marzo","Junio","Diciembre"],"c":0,"h":"Es el mes que abre el calendario.","f":"Enero recibe su nombre de Jano, dios romano asociado con los comienzos y las puertas."},{"id":"E20","level":"Fácil","q":"Órgano principal para respirar?","a":["Pulmones","Estómago","Corazón","Riñones"],"c":0,"h":"Son dos órganos ubicados en el tórax.","f":"Los pulmones intercambian oxígeno y dióxido de carbono entre el aire y la sangre."},{"id":"E21","level":"Fácil","q":"Lados de un triángulo?","a":["2","3","4","5"],"c":1,"h":"Una figura con esa cantidad de lados también tiene tres vértices.","f":"En geometría, el triángulo es el polígono con el menor número de lados."},{"id":"E22","level":"Fácil","q":"Día después del viernes?","a":["Jueves","Sábado","Domingo","Lunes"],"c":1,"h":"Es el día que inicia el fin de semana para muchas personas.","f":"Los nombres de los días de la semana en español vienen del latín y de referencias a astros y dioses."},{"id":"E23","level":"Fácil","q":"Moneda de Estados Unidos?","a":["Euro","Peso","Dólar","Libra"],"c":2,"h":"Es la moneda cuyo símbolo es $.","f":"El dólar estadounidense comenzó a emitirse como moneda nacional en 1792."},{"id":"E24","level":"Fácil","q":"Fruta amarilla y alargada?","a":["Manzana","Banano","Uva","Fresa"],"c":1,"h":"Es una fruta tropical amarilla, alargada y fácil de pelar.","f":"El banano es una de las frutas más consumidas del mundo y botánicamente es una baya."},{"id":"E25","level":"Fácil","q":"7 + 8?","a":["13","14","15","16"],"c":2,"h":"Suma siete con ocho.","f":"Una forma rápida de hacerlo es 7 + 3 = 10 y luego sumar los 5 restantes."},{"id":"E26","level":"Fácil","q":"Color típico de una esmeralda?","a":["Verde","Azul","Rojo","Blanco"],"c":0,"h":"Piensa en el color asociado normalmente con las gemas de esta especie.","f":"El color verde de la esmeralda se debe principalmente a pequeñas cantidades de cromo o vanadio."},{"id":"E27","level":"Fácil","q":"Animal que produce leche?","a":["Vaca","Serpiente","Águila","Tiburón"],"c":0,"h":"Es un mamífero doméstico muy conocido en las granjas.","f":"La leche de vaca es uno de los alimentos de origen animal más consumidos y procesados en el mundo."},{"id":"E28","level":"Fácil","q":"Dedos de una mano normalmente?","a":["4","5","6","10"],"c":1,"h":"Cuenta los dedos de una sola mano.","f":"La mayoría de los seres humanos tiene cinco dedos en cada mano, incluido el pulgar."},{"id":"E29","level":"Fácil","q":"Planeta más cercano al Sol?","a":["Mercurio","Venus","Tierra","Marte"],"c":0,"h":"Es el planeta que está más cerca de nuestra estrella.","f":"Mercurio es el planeta más cercano al Sol y completa una órbita en unos 88 días terrestres."},{"id":"E30","level":"Fácil","q":"Forma de una pelota?","a":["Cúbica","Esférica","Triangular","Plana"],"c":1,"h":"Piensa en la forma que no tiene esquinas y rueda fácilmente.","f":"Una pelota es aproximadamente esférica, lo que permite que ruede en muchas direcciones."},{"id":"E31","level":"Fácil","q":"9 - 4?","a":["3","4","5","6"],"c":2,"h":"Resta cuatro a nueve.","f":"Una manera de comprobarlo es contar hacia atrás cuatro pasos desde nueve."},{"id":"E32","level":"Fácil","q":"Sentido para escuchar?","a":["Vista","Tacto","Oído","Gusto"],"c":2,"h":"Es el sentido que usamos cuando llegan sonidos a nuestros oídos.","f":"El oído también ayuda al equilibrio gracias a estructuras ubicadas en el oído interno."},{"id":"E33","level":"Fácil","q":"Animal terrestre más grande?","a":["Elefante","Jirafa","Caballo","Rinoceronte"],"c":0,"h":"Es un mamífero enorme de color gris que vive en África y Asia.","f":"El elefante africano es el animal terrestre más grande; algunos ejemplares pueden superar las seis toneladas."},{"id":"E34","level":"Fácil","q":"Gas que necesitamos para respirar?","a":["Oxígeno","Helio","Neón","Hidrógeno"],"c":0,"h":"Es el gas que el cuerpo utiliza para obtener energía a partir de los alimentos.","f":"El oxígeno forma aproximadamente una quinta parte del aire de la atmósfera terrestre."},{"id":"E35","level":"Fácil","q":"Capital de Perú?","a":["Lima","Cusco","Arequipa","Trujillo"],"c":0,"h":"Es una ciudad ubicada en la costa del Pacífico peruano.","f":"Lima fue fundada por los españoles en 1535 y es la ciudad más poblada del Perú."},{"id":"E36","level":"Fácil","q":"Colores tradicionales del arcoíris?","a":["5","6","7","8"],"c":2,"h":"La cifra tradicional asociada con el arcoíris se aprende desde pequeños.","f":"La idea de siete colores del arcoíris se popularizó en Europa a partir de la descripción de Isaac Newton."},{"id":"E37","level":"Fácil","q":"Parte de la planta que absorbe agua?","a":["Flor","Hoja","Raíz","Fruto"],"c":2,"h":"Está normalmente debajo del suelo y crece en sentido contrario al tallo.","f":"Las raíces absorben agua y sales minerales del suelo y también ayudan a sujetar la planta."},{"id":"E38","level":"Fácil","q":"Deporte con balón y canasta?","a":["Tenis","Baloncesto","Béisbol","Golf"],"c":1,"h":"Se juega llevando el balón hacia una canasta elevada.","f":"El baloncesto fue inventado por James Naismith en 1891."},{"id":"E39","level":"Fácil","q":"Estación después del invierno?","a":["Otoño","Primavera","Verano","Invierno"],"c":1,"h":"Es la estación asociada con flores y nuevos brotes en muchas regiones.","f":"En el hemisferio norte, la primavera comienza alrededor del equinoccio de marzo; en el sur ocurre al revés."},{"id":"E40","level":"Fácil","q":"3 × 4?","a":["7","10","12","14"],"c":2,"h":"Multiplica tres por cuatro.","f":"La multiplicación puede verse como sumar cuatro tres veces: 4 + 4 + 4."},{"id":"E41","level":"Fácil","q":"Metal precioso amarillo?","a":["Plata","Oro","Cobre","Hierro"],"c":1,"h":"Es un metal famoso por su brillo amarillo y su valor.","f":"El oro es muy resistente a la corrosión y por eso puede conservarse durante muchísimo tiempo."},{"id":"E42","level":"Fácil","q":"Animal con trompa larga?","a":["Elefante","León","Cebra","Mono"],"c":0,"h":"Es el animal grande que usa una trompa para agarrar y mover objetos.","f":"La trompa del elefante combina nariz y labio superior y puede servir para respirar, oler, tocar y tomar agua."},{"id":"E43","level":"Fácil","q":"Planeta donde vivimos?","a":["Marte","Venus","Tierra","Júpiter"],"c":2,"h":"Es el tercer planeta contando desde el Sol.","f":"La Tierra es el único planeta conocido que alberga vida y tiene abundante agua líquida en su superficie."},{"id":"E44","level":"Fácil","q":"Bebida obtenida de uvas fermentadas?","a":["Leche","Café","Vino","Té"],"c":2,"h":"Se obtiene a partir del jugo de uvas que fermenta.","f":"La fermentación transforma los azúcares de la uva en alcohol y otros compuestos que aportan aroma y sabor."},{"id":"E45","level":"Fácil","q":"Minutos de una hora?","a":["30","45","60","90"],"c":2,"h":"Piensa en sesenta segundos por cada unidad de tiempo.","f":"Una hora tiene 60 minutos porque el sistema tradicional de tiempo heredó divisiones basadas en el número 60."},{"id":"E46","level":"Fácil","q":"Capital de Colombia?","a":["Bogotá","Cali","Medellín","Cartagena"],"c":0,"h":"Es la capital ubicada en una alta meseta de los Andes colombianos.","f":"Bogotá está a más de 2.500 metros sobre el nivel del mar y es una de las capitales más altas de Sudamérica."},{"id":"E47","level":"Fácil","q":"Aparato para llamar a distancia?","a":["Teléfono","Brújula","Termómetro","Microscopio"],"c":0,"h":"Es el dispositivo que permitió hablar con alguien que estaba :2,"h":"Es una glándula ubicada detrás del estómago.","f":"El páncreas produce insulina y otras sustancias importantes para la digestión y el metabolismo."},{"id":"D6","level":"Difícil","q":"Número atómico del carbono?","a":["4","6","8","12"],"c":1,"h":"Mira el número que identifica al carbono en la tabla periódica.","f":"El carbono tiene seis protones en su núcleo y por eso su número atómico es 6."},{"id":"D7","level":"Difícil","q":"Científico de la selección natural?","a":["Darwin","Mendel","Pasteur","Faraday"],"c":0,"h":"Es el naturalista inglés que explicó la evolución mediante selección natural.","f":"Charles Darwin publicó El origen de las especies en 1859."},{"id":"D8","level":"Difícil","q":"Capital de Kazajistán?","a":["Almaty","Astaná","Taskent","Biskek"],"c":1,"h":"Es la capital de Kazajistán; su nombre ha cambiado varias veces.","f":"Astaná ha tenido otros nombres, entre ellos Nur-Sultán, y volvió oficialmente a llamarse Astaná en 2022."},{"id":"D9","level":"Difícil","q":"Partícula con carga negativa?","a":["Protón","Neutrón","Electrón","Positrón"],"c":2,"h":"Es una partícula subatómica del átomo con carga eléctrica negativa.","f":"Los electrones se encuentran en regiones alrededor del núcleo y son fundamentales para los enlaces químicos."},{"id":"D10","level":"Difícil","q":"pH de una solución neutra?","a":["0","5","7","14"],"c":2,"h":"Está justo en el centro de la escala que va de ácido a básico para una solución neutra.","f":"A temperatura cercana a 25 °C, una solución acuosa neutra tiene un pH cercano a 7."},{"id":"D11","level":"Difícil","q":"Símbolo Hg?","a":["Plata","Mercurio","Magnesio","Manganeso"],"c":1,"h":"Es el símbolo de un metal y la abreviatura viene de su nombre latino.","f":"Hg proviene de “hydrargyrum”, término latino relacionado con “plata líquida”."},{"id":"D12","level":"Difícil","q":"Raíz cuadrada de 144?","a":["10","11","12","14"],"c":2,"h":"Busca el número que multiplicado por sí mismo da 144.","f":"12 × 12 = 144, así que 12 es la raíz cuadrada principal de 144."},{"id":"D13","level":"Difícil","q":"Capa con mayor concentración de ozono?","a":["Troposfera","Estratosfera","Mesosfera","Termosfera"],"c":1,"h":"Está por encima de la troposfera y concentra la mayor parte del ozono atmosférico.","f":"La capa de ozono de la estratosfera absorbe gran parte de la radiación ultravioleta dañina del Sol."},{"id":"D14","level":"Difícil","q":"Capital de Etiopía?","a":["Nairobi","Jartum","Adís Abeba","Asmara"],"c":2,"h":"Es la capital de Etiopía y está en las tierras altas.","f":"Adís Abeba alberga la sede de la Unión Africana."},{"id":"D15","level":"Difícil","q":"Rama matemática de las propiedades de los números?","a":["Geometría","Teoría de números","Topología","Cálculo"],"c":1,"h":"Estudia números enteros, primos, divisibilidad y otras propiedades aritméticas.","f":"La teoría de números fue estudiada por matemáticos como Gauss, quien la llamó “reina de las matemáticas”."},{"id":"D16","level":"Difícil","q":"Científico de las leyes de la herencia con guisantes?","a":["Mendel","Pasteur","Hooke","Watson"],"c":0,"h":"Es el monje y científico que experimentó con plantas de guisantes.","f":"Gregor Mendel descubrió patrones de herencia que ayudaron a fundar la genética moderna."},{"id":"D17","level":"Difícil","q":"Hueso más largo del cuerpo?","a":["Tibia","Fémur","Húmero","Radio"],"c":1,"h":"Es el gran hueso que recorre el muslo desde la cadera hasta la rodilla.","f":"El fémur es el hueso más largo y uno de los más fuertes del cuerpo humano."},{"id":"D18","level":"Difícil","q":"Planeta con rotación más lenta?","a":["Venus","Marte","Júpiter","Neptuno"],"c":0,"h":"Es un planeta que gira muy lentamente y además lo hace en sentido contrario al de la mayoría.","f":"Venus tarda unos 243 días terrestres en girar sobre su eje, más que en completar una órbita alrededor del Sol."},{"id":"D19","level":"Difícil","q":"Capital de Georgia (país)?","a":["Ereván","Tiflis","Bakú","Batumi"],"c":1,"h":"Es la capital de Georgia, el paí function updateMusicButtons(){const text=musicEnabled?"🎵 ON":"🔇 OFF";musicGame.textContent=text;musicHome.textContent=musicEnabled?"🎵 MÚSICA: ON":"🔇 MÚSICA: OFF";musicHome.classList.toggle("off",!musicEnabled);musicGame.classList.toggle("off",!musicEnabled)}
let musicMode="menu";
function musicNote(freq,when,duration,volume,type="triangle"){if(!audioCtx||audioCtx.state!=="running")return;if(!musicGain)musicGain=audioCtx.createGain();const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,when);gain.gain.setValueAtTime(.0001,when);gain.gain.exponentialRampToValueAtTime(volume,when+.035);gain.gain.exponentialRampToValueAtTime(.0001,when+Math.max(.08,duration-.04));osc.connect(gain);gain.connect(musicGain);osc.start(when);osc.stop(when+duration+.05)}
function scheduleMusic(){if(!audioCtx||!musicEnabled||!musicLooping)return;const run=++musicRunId;const notes=musicMode==="game"?TENSION_NOTES:MENU_NOTES;const bass=musicMode==="game"?TENSION_BASS:MENU_BASS;const length=musicMode==="game"?24500:16000;const start=audioCtx.currentTime+.08;const type=musicMode==="game"?"triangle":"sine";for(const [freq,offset,dur,vol] of notes)musicNote(freq,start+offset,dur,vol,type);for(const [freq,offset,dur,vol] of bass)musicNote(freq,start+offset,dur,vol,"sine");if(musicMode==="game")for(const [freq,offset,dur,vol] of TENSION_HITS)musicNote(freq,start+offset,dur,vol,"square");clearTimeout(musicTimer);musicTimer=setTimeout(()=>{if(run===musicRunId)scheduleMusic()},length-150)}
function setMusicMode(mode){musicMode=mode;if(musicLooping){musicRunId++;clearTimeout(musicTimer);scheduleMusic()}}
function startMusic(){try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume();if(!musicGain){musicGain=audioCtx.createGain();musicGain.connect(audioCtx.destination)}musicGain.gain.setTargetAtTime(volumeLevel/100,audioCtx.currentTime,.02);if(musicEnabled&&!musicLooping){musicLooping=true;scheduleMusic()}}catch(e){}}
function stopMusic(){musicLooping=false;musicRunId++;clearTimeout(musicTimer);musicTimer=null}
let sfxGain=null;
function playTone(freq,when,duration,volume,type="sine"){
  if(!audioCtx || audioCtx.state === "closed") return;
  if(audioCtx.state === "suspended") audioCtx.resume();
  if(!sfxGain){
    sfxGain=audioCtx.createGain();
    sfxGain.connect(audioCtx.destination);
  }
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.type=type;
  osc.frequency.setValueAtTime(freq,when);
  const level=Math.max(0,Math.min(1,Number(volumeLevel||0)/100))*volume;
  gain.gain.setValueAtTime(0.0001,when);
  gain.gain.exponentialRampToValueAtTime(Math.max(0.0001,level),when+0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001,when+Math.max(0.04,duration-0.025));
  osc.connect(gain);
  gain.connect(sfxGain);
  osc.start(when);
  osc.stop(when+duration+0.04);
}

function playCorrect(){if(!audioCtx)return;try{if(audioCtx.state==="suspended")audioCtx.resume();const t=audioCtx.currentTime+.02;playTone(523.25,t,.13,.07,"triangle");playTone(659.25,t+.11,.13,.07,"triangle");playTone(783.99,t+.22,.18,.08,"triangle");}catch(e){}}
function playWrong(){if(!audioCtx)return;try{if(audioCtx.state==="suspended")audioCtx.resume();const t=audioCtx.currentTime+.02;playTone(220,t,.18,.08,"sawtooth");playTone(164.81,t+.15,.2,.08,"sawtooth");playTone(130.81,t+.31,.28,.09,"sawtooth");}catch(e){}}
function playJoker(kind){if(!audioCtx)return;try{if(audioCtx.state==="suspended")audioCtx.resume();const t=audioCtx.currentTime+.02;const sounds={
"50":()=>{playTone(392,t,.1,.07,"square");playTone(523.25,t+.09,.12,.08,"square");},
"call":()=>{playTone(659.25,t,.11,.07,"sine");playTone(783.99,t+.12,.11,.07,"sine");playTone(659.25,t+.24,.16,.07,"sine");},
"roulette":()=>{playTone(330,t,.07,.06,"triangle");playTone(440,t+.08,.07,.06,"triangle");playTone(554.37,t+.16,.1,.07,"triangle");playTone(659.25,t+.25,.14,.08,"triangle");},
"wizard":()=>{playTone(261.63,t,.1,.06,"sine");playTone(329.63,t+.08,.1,.06,"sine");playTone(392,t+.16,.1,.06,"sine");playTone(523.25,t+.25,.2,.08,"sine");},
"recover":()=>{playTone(523.25,t,.09,.07,"triangle");playTone(659.25,t+.09,.09,.07,"triangle");playTone(783.99,t+.18,.15,.08,"triangle");}
};if(sounds[kind])sounds[kind]()}catch(e){}}

function updateVolumeUI(){["volPctHome","volPctGame"].forEach(id=>{const el=$(id);if(el)el.textContent=volumeLevel+"%"})}
function setVolume(delta){volumeLevel=Math.max(0,Math.min(100,volumeLevel+delta));localStorage.setItem("concursillo_volume",String(volumeLevel));if(audioCtx&&musicGain)musicGain.gain.setTargetAtTime(volumeLevel/100,audioCtx.currentTime,.03);updateVolumeUI()}
function toggleMusic(){musicEnabled=!musicEnabled;if(musicEnabled){startMusic()}else{stopMusic()}updateMusicButtons()}
updateMusicButtons();updateVolumeUI();musicHome.onclick=toggleMusic;musicGame.onclick=toggleMusic;$("volDownHome").onclick=()=>setVolume(-10);$("volUpHome").onclick=()=>setVolume(10);$("volDownGame").onclick=()=>setVolume(-10);$("volUpGame").onclick=()=>setVolume(10);
const recover=$("recover"),menuBtn=$("menuBtn");
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function avail(arr){return arr.filter(x=>!used.has(x.id))}
function save(){localStorage.setItem(KEY,JSON.stringify([...used]))}
function start(cat="mixed"){currentCategory=cat;setMusicMode("game");startMusic();KEY=cat==="mixed"?"concursillo_used_210_v1":"concursillo_used_210_v1_"+cat;used=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"));let base=BANKS[cat],e=shuffle(avail(base.easy)),m=shuffle(avail(base.medium)),h=shuffle(avail(base.hard));if(e.length<5||m.length<5||h.length<5){bankEmpty();return}round=[...e.slice(0,5),...m.slice(0,5),...h.slice(0,5)];round.forEach(x=>used.add(x.id));save();p=0;u50=uCall=uRoulette=uWizard=false;[fifty,call,roulette].forEach(x=>x.disabled=false);recover.hidden=true;wizard.disabled=true;wizard.textContent="🔒";home.hidden=true;game.hidden=false;load()}
function render(){
 nextBtn.hidden=true;
 resolveBtn.hidden=true;
 q.innerHTML=`Pregunta ${p+1} de 15<br><span class="small">${current.level}</span><br>${current.q}`;
 ans.innerHTML="";
 hint.disabled=false;
 curiosity.disabled=true;
 st.textContent="";
 selectedAnswer=null;
 selectedButton=null;
 current.a.forEach((x,i)=>{let b=document.createElement("button");b.className="answer";b.dataset.letter=String.fromCharCode(65+i);b.textContent=x;b.onclick=()=>selectAnswer(i,b);ans.appendChild(b)});
 meta.textContent=`${CATEGORY_NAMES[currentCategory]} · ${current.level} · ${p+1}/15`;
 wizard.disabled=p<9||uWizard;
 wizard.textContent=p>=9?"🧙":"🔒";
 recover.hidden=p!==10
}
function selectAnswer(i,b){
 if(locked||b.disabled)return;
 [...ans.children].forEach(x=>x.classList.remove("selected"));
 selectedAnswer=i;
 selectedButton=b;
 b.classList.add("selected");
 resolveBtn.hidden=false;
 st.textContent="Respuesta seleccionada. Pulsa RESOLVER para comprobarla.";
}
function showInfo(title,icon,text){let o=document.createElement("div");o.className="overlay";o.innerHTML=`<div class="modal"><button class="close" id="ix">×</button><div style="font-size:48px">${icon}</div><b style="font-size:26px">${title}</b><div class="small" style="font-size:17px;margin-top:16px;line-height:1.6;opacity:1">${text}</div></div>`;document.body.appendChild(o);o.querySelector("#ix").onclick=()=>o.remove()}
hint.onclick=()=>{if(locked)return;showInfo("PISTA","💡",current.h)};
curiosity.onclick=()=>{if(curiosity.disabled)return;showInfo("CURIOSIDAD","🤓",current.f)};
function load(){if(p>=15){finish();return}current=round[p];render()}
function resolveAnswer(){
 if(locked||selectedAnswer===null)return;
 locked=true;
 resolveBtn.hidden=true;
 [...ans.children].forEach(x=>x.disabled=true);
 if(selectedAnswer===current.c){
  playCorrect();
  selectedButton.style.background="#16803c";
  selectedButton.classList.remove("selected");
  st.textContent="✅ ¡Correcta! Ahora puedes ver la curiosidad o pulsar SIGUIENTE.";
  curiosity.disabled=false;
  nextBtn.hidden=false;
 }else{
  playWrong();
  selectedButton.style.background="#9f1d35";
  ans.children[current.c].style.background="#16803c";
  st.textContent="❌ Incorrecta";
  setTimeout(()=>{locked=false;gameOver()},450);
 }
}
resolveBtn.onclick=resolveAnswer;
nextBtn.onclick=()=>{if(nextBtn.hidden)return;nextBtn.hidden=true;p++;locked=false;load()};
fifty.onclick=()=>{if(locked||u50)return;playJoker("50");u50=true;fifty.disabled=true;shuffle([0,1,2,3].filter(i=>i!==current.c)).slice(0,2).forEach(i=>ans.children[i].classList.add("removed"))};
call.onclick=()=>{if(locked||uCall)return;playJoker("call");uCall=true;call.disabled=true;sec=90;openCall()};
function openCall(){let o=document.createElement("div");o.className="overlay";o.innerHTML=`<div class="modal"><button class="close" id="cx">×</button><div class="call">📞</div><b style="font-size:25px">LLAMADA</b><div class="small">Tiempo restante</div><div class="timer" id="tm">1:30</div><div class="small" id="ct">La llamada está activa...</div></div>`;document.body.appendChild(o);let tm=o.querySelector("#tm"),ct=o.querySelector("#ct");o.querySelector("#cx").onclick=()=>{clearInterval(timer);timer=null;o.remove()};clearInterval(timer);timer=setInterval(()=>{sec--;tm.textContent=Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");if(sec<=10&&sec>0)tm.classList.add("warning");if(sec<=0){clearInterval(timer);timer=null;tm.textContent="0:00";ct.textContent="⏰ ¡Se acabó el tiempo! Pulsa × para cerrar."}},1000)}
roulette.onclick=()=>{if(locked||uRoulette)return;playJoker("roulette");uRoulette=true;roulette.disabled=true;locked=true;let o=document.createElement("div");o.className="overlay";o.innerHTML=`<div class="modal"><b style="font-size:25px">🎰 RULETA</b><div class="wheelbox"><div class="pointer"></div><div class="wheel" id="wheel"><div class="wheelnums"><span>0</span><span>1</span><span>2</span><span>3</span></div></div></div><div class="small">Girando...</div></div>`;document.body.appendChild(o);let n=Math.floor(Math.random()*4);let wheel=o.querySelector("#wheel");let target=[0,-90,180,90][n];wheel.style.transform="rotate(0deg)";void wheel.offsetWidth;wheel.style.transform=`rotate(${1440+target}deg)`;setTimeout(()=>{let w=shuffle([0,1,2,3].filter(i=>i!==current.c)).slice(0,n);w.forEach(i=>ans.children[i].classList.add("removed"));let nums=w.map(i=>i+1),lets=w.map(i=>String.fromCharCode(65+i));o.querySelector(".modal").innerHTML=`<button class="close" id="rx">×</button><b style="font-size:25px">🎰 RESULTADO</b><div class="result">${n?`Se eliminaron ${n} respuesta${n==1?"":"s"}`:"No se eliminó ninguna respuesta"}</div>${n?`<div class="letters">${lets.join(" · ")}</div><div class="small">Respuestas eliminadas: ${nums.join(" y ")}</div>`:""}<div class="small">La respuesta correcta nunca se elimina.</div>`;o.querySelector("#rx").onclick=()=>{o.remove();locked=false}},2100)};
wizard.onclick=()=>{if(locked||p<9||uWizard)return;playJoker("wizard");uWizard=true;wizard.disabled=true;let base=BANKS[currentCategory],source=current.level==="Fácil"?base.easy:current.level==="Intermedio"?base.medium:base.hard;let pool=avail(source).filter(x=>x.id!==current.id);if(!pool.length){st.textContent="No quedan preguntas disponibles de este nivel.";return}current=pool[Math.floor(Math.random()*pool.length)];used.add(current.id);save();render();st.textContent="🧙 Pregunta cambiada por una que nunca habías jugado."};
function gameOver(){stopMusic();let o=document.createElement("div");o.className="overlay";o.innerHTML=`<div class="modal"><div style="font-size:55px">💥</div><b style="font-size:28px">¡HAS PERDIDO!</b><div class="small" style="margin:12px 0">La respuesta correcta era:</div><div class="result">${current.a[current.c]}</div><div class="small">La partida termina inmediatamente al responder incorrectamente.</div><button class="again" id="ag">VOLVER A JUGAR</button></div>`;document.body.appendChild(o);o.querySelector("#ag").onclick=()=>{o.remove();start(currentCategory)}}
recover.onclick=()=>{if(p!==10)return;let o=document.createElement("div");o.className="overlay";let can=[];if(u50)can.push(["50/50","50"]);if(uCall)can.push(["📞 Llamada","call"]);if(uRoulette)can.push(["🎰 Ruleta","roulette"]);let buttons=can.length?can.map(([label,type])=>`<button class="again recbtn" data-type="${type}" style="margin:0">${label}</button>`).join(""):`<div class="small" style="margin:18px 0">Todavía no has usado ningún comodín. Usa uno y podrás recuperarlo desde aquí.</div>`;o.innerHTML=`<div class="modal"><button class="close" id="cr">×</button><b style="font-size:27px">🎁 RECUPERAR COMODÍN</b>${buttons}</div>`;document.body.appendChild(o);o.querySelector("#cr").onclick=()=>o.remove();o.querySelectorAll(".recbtn").forEach(btn=>btn.onclick=()=>{let type=btn.dataset.type;playJoker("recover");if(type==="50"){u50=false;fifty.disabled=false}else if(type==="call"){uCall=false;call.disabled=false}else{uRoulette=false;roulette.disabled=false}recover.hidden=true;st.textContent="🎁 ¡Comodín recuperado!";o.remove()})};
function goMenu(){clearInterval(timer);timer=null;document.querySelectorAll(".overlay").forEach(o=>o.remove());locked=false;game.hidden=true;home.hidden=false;nextBtn.hidden=true;st.textContent="";setMusicMode("menu");stopMusic()}
